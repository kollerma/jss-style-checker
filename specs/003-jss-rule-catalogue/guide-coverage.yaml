# Guide coverage — which provisions of the JSS authorities jss-lint
# checks, and which it does not.
#
# Hand-curated (spec 027 item A). Schema and validator contract:
# contracts/coverage-file.md; validated by tools/_coverage_validate.py and
# tests/unit/journals/jss/test_guide_coverage.py, which fail the build when
# a listed rule is retired, when an active rule is claimed by no directive
# (Constitution §V — a rule without a provision has no authority), or when
# a non-`checked` row carries no reason.
#
# Migrated from checklists/rule-catalogue-review.md §1.1–1.4 (146 rows,
# 2026-04-23) and re-judged for spec 027: six rows credited rules retired
# since, five rows are now covered by rules added after the checklist was
# written, and five provisions the checklist had missed were added so that
# every active rule is claimed. **This file is now authoritative**; the
# checklist stays as the historical review record.
#
# `status`:
#   checked      — a rule enforces this provision
#   partial      — enforced in part; `reason` says what is not covered
#   not_checked  — a real gap; `reason` says why it is not (yet) checked
#   out_of_scope — not checkable from the manuscript source at all
#                  (compilability, graphics legibility, submission
#                  metadata, replication scripts). Excluded from the
#                  "checks N of M" ratio the author footer prints.

version: 1

# The dated edition of each authority this rule set derives from. The
# prose guide has no edition, so the fetch date is the honest pin; the
# vendored jss.cls is the only source with a real version.
sources:
  jss_cls:
    file: docs/jss-template/jss.cls
    edition: "3.3"
    date: "2021-05-23"
  article_tex:
    file: docs/jss-template/article.tex
    date: "2021-12-10"
  style_guide:
    url: "https://www.jstatsoft.org/style"
    fetched: "2026-04-23"
  author_instructions:
    url: "https://www.jstatsoft.org/authors"
    fetched: "2026-04-23"

